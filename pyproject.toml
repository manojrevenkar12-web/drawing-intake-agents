[project]
name = "dia"
version = "1.0.0"
description = "Drawing intake agents: read customer engineering drawings (vector PDFs and scans) into structured data, check them against ISO tolerances and plant capability, compare revisions, route doubtful fields to an engineer, export to a legacy ERP"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6", "pyyaml>=6", "numpy>=1.26", "scipy>=1.11", "opencv-python-headless>=4.9", "pymupdf>=1.24",
  "pytesseract>=0.3.10", "reportlab>=4.0", "torch>=2.2", "httpx>=0.27", "fastapi>=0.110", "python-multipart>=0.0.9",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF005", "E731", "SIM102", "SIM105", "SIM108", "B905", "RUF012", "B008"]
