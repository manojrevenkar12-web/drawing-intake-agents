# The intake desk as a single deployment. It holds no customer data at rest: drawings are processed in memory and
# what leaves is the ERP import file.
apiVersion: apps/v1
kind: Deployment
metadata: {name: drawing-intake, labels: {app: drawing-intake}}
spec:
  replicas: 2
  selector: {matchLabels: {app: drawing-intake}}
  template:
    metadata: {labels: {app: drawing-intake}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/manojrevenkar12-web/drawing-intake-agents:latest
          ports: [{containerPort: 8000}]
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: drawing-intake, key: anthropic-api-key, optional: true}}
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          readinessProbe: {httpGet: {path: /api/health, port: 8000}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: 8000}, periodSeconds: 30}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true,
                            capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: drawing-intake}
spec:
  selector: {app: drawing-intake}
  ports: [{port: 80, targetPort: 8000}]
